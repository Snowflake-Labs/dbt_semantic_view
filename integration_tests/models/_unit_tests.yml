version: 2

unit_tests:
  - name: test_table_refer_to_semantic_view_from_table_fixtures
    model: table_refer_to_semantic_view_unit_test
    given:
      - input: ref('base_table')
        rows:
          - {value: 1}
          - {value: 2}
      - input: source('seed_sources', 'base_table2')
        rows:
          - {value: 10}
    expect:
      rows:
        - {TOTAL_ROWS: 3, MAX_VOLUME: 10}

  - name: test_own_with_bails_out
    model: table_refer_to_semantic_view_unit_test_failing_case
    given:
      - input: ref('base_table')
        rows:
          - {value: 1}
      - input: source('seed_sources', 'base_table2')
        rows:
          - {value: 10}
    expect:
      rows:
        - {X: 1, TOTAL_ROWS: 1, MAX_VOLUME: 10}
